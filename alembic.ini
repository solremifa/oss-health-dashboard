# Alembic configuration.
#
# ASCII ONLY. This file is read with the system locale (cp949 on the dev
# machine), so any non-ASCII byte raises UnicodeDecodeError before Alembic
# even starts. Korean notes belong in migrations/env.py, which Python reads
# as UTF-8. See docs/findings.md trap 6.
#
# The database URL is intentionally NOT set here. It is resolved in
# migrations/env.py from DATABASE_URL so that code and migrations share a
# single source (CLAUDE.md section 3).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Generated migration scripts are written as UTF-8; their comments are Korean.
output_encoding = utf-8

# No post-write hooks. Wiring "ruff format" in here needs either a
# console_scripts entrypoint that ruff does not publish, or an absolute
# interpreter path that breaks on the Linux CI runners. Run
# "ruff check --fix ." and "ruff format ." by hand after generating a
# revision -- the commit rhythm in CLAUDE.md section 11 requires both to
# pass before committing anyway.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
